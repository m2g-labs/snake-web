name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css icon.svg manifest.webmanifest src _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          # Fail if a local file referenced by index.html is missing from _site
          missing=0
          for f in $(grep -oE '(href|src)="[^"#?]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | grep -vE '^(https?:)?//|^[a-z]+:'); do
            if [ ! -e "_site/$f" ]; then echo "::error::missing from _site: $f"; missing=1; fi
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
