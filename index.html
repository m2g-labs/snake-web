<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="score">Score: 0</div>
    <div id="board">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Snake</h1>
        <p id="overlay-msg"></p>
        <button id="action" type="button">Start</button>
      </div>
    </div>
    <div id="dpad" aria-label="Direction pad">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
