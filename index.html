<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snake</title>
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Classic snake game for desktop and mobile.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="score">Score: 0</div>
    <div id="best">Best: 0</div>
    <div id="board">
      <canvas id="game"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Snake</h1>
        <p id="overlay-msg"></p>
        <div id="difficulty">
          <label for="difficulty-slider">Difficulty</label>
          <input id="difficulty-slider" type="range" min="1" max="10" step="1" value="5">
          <div id="difficulty-label" aria-live="polite"></div>
        </div>
        <div id="board-size">
          <label for="board-size-select">Board size</label>
          <select id="board-size-select">
            <option value="10">10×10</option>
            <option value="15">15×15</option>
            <option value="20" selected>20×20</option>
            <option value="25">25×25</option>
            <option value="30">30×30</option>
          </select>
        </div>
        <button id="action" type="button">Start</button>
      </div>
    </div>
    <div id="dpad" aria-label="Direction pad">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
